<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><base href="../"><title>Aperçu · figurines</title>
<style>html,body{margin:0;height:100%;background:#0b0908}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }</script>
</head><body>
<script type="module">
// Aperçu des figurines du Prologue : héros (rangée du fond) et PNJ/monture (devant). ?ids=aldric,berthe
import * as THREE from 'three';
import { makeFigure } from './js/three/figures.js';
import { STORY } from './js/stories/prologue.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(devicePixelRatio); r.setSize(innerWidth, innerHeight);
r.shadowMap.enabled = true; r.toneMapping = THREE.ACESFilmicToneMapping; document.body.append(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x14100d);
sc.add(new THREE.HemisphereLight(0xd8dcea, 0x3a2e22, 1.6));
const sun = new THREE.DirectionalLight(0xffe6c4, 2.2); sun.position.set(-2, 4, 3); sc.add(sun);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 50);
const all = [...STORY.heroes.map(h => ({ ...h, team: 'hero' })), ...STORY.cast.filter(c => ['npc', 'mount'].includes(c.team))];
const ids = q.get('ids')?.split(',');
const list = ids ? all.filter(c => ids.includes(c.id)) : all;
const heroes = list.filter(c => c.team === 'hero'), others = list.filter(c => c.team !== 'hero');
const mixers = [];
async function row(items, z) {
  for (const [i, c] of items.entries()) {
    const f = await makeFigure({ id: c.id, name: c.name, kind: c.kind, color: c.color, base: c.base || c.color, team: c.team, idle: c.idle });
    f.position.set((i - (items.length - 1) / 2) * 0.62, 0, z); sc.add(f);
    if (f.userData.anim) mixers.push(f.userData.anim.mixer);
  }
}
await row(heroes, -0.55); await row(others, 0.35);
cam.position.set(0, 1.6, 4.4); cam.lookAt(0, 0.25, -0.1);
const clock = new THREE.Timer();
r.setAnimationLoop(() => { clock.update(); const dt = clock.getDelta(); mixers.forEach(m => m.update(dt)); r.render(sc, cam); });
window.__ready = true;
</script></body></html>
