<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0908">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Prototype</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/fonts.css?v=1795563926">
  <link rel="stylesheet" href="css/play.css?v=1795563926">
  <script type="importmap">
  { "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="viewport"></div>
  <div id="hud"></div>
  <script type="module" src="js/main.js?v=1795563926"></script>
  <script>
    // Garde-fou : si les scripts chargés sont plus vieux que ceux du serveur (cache du navigateur), on répare.
    setTimeout(async () => {
      try {
        const txt = await (await fetch('js/version.js?t=' + Date.now(), { cache: 'no-store' })).text();
        const server = (txt.match(/VERSION = '([^']+)'/) || [])[1];
        if (server && window.__APP_V !== server && !sessionStorage.getItem('grimoire.fixing')) {
          sessionStorage.setItem('grimoire.fixing', '1');
          const d = document.createElement('div');
          d.style.cssText = 'position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#0b0908;color:#ecd9a6;font:18px Georgia,serif;text-align:center;padding:20px';
          d.textContent = 'Ancienne version détectée (' + (window.__APP_V || 'v2') + ') — mise à jour vers ' + server + '…';
          document.body.append(d);
          const { hardRefresh } = await import('./js/core/pwa.js?t=' + Date.now());
          await hardRefresh(p => { d.textContent = 'Mise à jour vers ' + server + '… ' + Math.round(p * 100) + ' %'; });
        } else if (window.__APP_V === server) sessionStorage.removeItem('grimoire.fixing');
      } catch {}
    }, 4000);
  </script>
</body>
</html>
